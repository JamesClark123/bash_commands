name: git-cli
help: Custom cli wrapper for git
version: 0.1.0

commands:

- name: log
  alias: l
  help: |-
    Show the commit history.
    Passes through to `git log` and accepts any of its flags/args.
    Use -g for a decorated, one-line graph view of the history.
  catch_all: true
  flags:
    - long: --graph
      short: -g
      help: Show history as a one-line decorated commit graph
  examples:
    - 'g l                     # recent commits (shell alias: gl)'
    - 'g l -g                  # one-line graph view (shell alias: glg)'
    - 'g l --oneline -10       # last 10 commits, condensed'
    - 'g l main..HEAD          # commits on this branch not yet on main'

- name: status
  alias: s
  help: |-
    Show the working tree status.
    Passes through to `git status` and accepts any of its flags/args.
  catch_all: true
  examples:
    - 'g s                     # working tree status (shell alias: gs)'
    - 'g s -s                  # short-format status'
    - 'g s -b                  # include branch and tracking info'

- name: diff
  alias: d
  help: |-
    Show changes between commits, branches, the index and the working tree.
    Passes through to `git diff` and accepts any of its flags/args.
  catch_all: true
  examples:
    - 'g d                     # unstaged changes only'
    - 'g d --staged            # staged changes (what would be committed)'
    - 'g d --stat              # summary of changed files (shell alias: gds)'
    - 'g d branch1..branch2    # difference between two branches'
    - 'g d HEAD~3              # changes since 3 commits ago'

- name: checkout
  alias: co
  help: |-
    Switch branches or restore working tree files.
    Passes through to `git checkout` and accepts any of its flags/args.
  catch_all: true
  examples:
    - 'g co main               # switch to the main branch (shell alias: gco)'
    - 'g co -                  # switch back to the previous branch'
    - 'g co -b feature/login   # create and switch to a new branch'
    - 'g co -B feature/login   # create or reset a branch, then switch (shell alias: gcoB)'

- name: add
  alias: a
  help: |-
    Stage file contents for the next commit.
    Passes through to `git add` and accepts any of its flags/args.
  catch_all: true
  examples:
    - 'g a .                   # stage everything in the current directory'
    - 'g a -u                  # stage modified/deleted tracked files (shell alias: gau)'
    - 'g a -A                  # stage all changes, including new files (shell alias: gaA)'
    - 'g a -p                  # interactively stage hunks'

- name: commit
  alias: c
  help: |-
    Record staged changes to the repository.
    With no arguments, opens an interactive picker (Amend, Amend no edit,
    Fixup, Squash) to build the commit for you. Otherwise passes through to
    `git commit` with any flags/args you supply.
  catch_all: true
  examples:
    - 'g c                     # interactive commit-type picker'
    - 'g c -m "fix: typo"      # commit staged changes with a message'
    - 'g c --amend             # amend the previous commit (shell alias: gca)'
    - 'g c --amend --no-edit   # amend without editing the message (shell alias: gcan)'

- name: push
  alias: ph
  help: |-
    Update remote refs along with associated objects.
    Passes through to `git push` and accepts any of its flags/args.
  catch_all: true
  examples:
    - 'g ph                    # push current branch (shell alias: gph)'
    - 'g ph -f                 # force push (shell alias: gpf)'
    - 'g ph origin --tags      # push all tags (shell alias: gpt)'
    - 'g ph --set-upstream origin <branch>   # push and set upstream (shell alias: gpsu)'

- name: pull
  alias: pl
  help: |-
    Fetch from and integrate with another repository or local branch.
    Passes through to `git pull` and accepts any of its flags/args.
  catch_all: true
  examples:
    - 'g pl                    # pull the current branch (shell alias: gpl)'
    - 'g pl --rebase           # pull and rebase local commits on top'
    - 'g pl origin main        # pull a specific remote branch'

- name: fetch
  alias: f
  help: |-
    Download objects and refs from another repository.
    Passes through to `git fetch` and accepts any of its flags/args.
  catch_all: true
  examples:
    - 'g f                     # fetch from the default remote'
    - 'g f --prune             # fetch and remove stale remote refs (shell alias: gfp)'
    - 'g f --all               # fetch from all remotes'

- name: rebase
  alias: r
  help: |-
    Reapply commits on top of another base.
    With no arguments, walks you through an interactive flow: pick a target
    branch, then a base (merge-base, HEAD~, or a commit chosen from the log)
    and rebases the current branch onto it with --autosquash. Otherwise passes
    through to `git rebase` with any flags/args you supply.
  catch_all: true
  examples:
    - 'g r                     # interactive guided rebase (shell alias: gr)'
    - 'g r --continue          # continue after resolving conflicts (shell alias: grc)'
    - 'g r --abort             # cancel an in-progress rebase'
    - 'g r --autosquash -i --onto main HEAD~1 <branch>   # squash onto main (shell alias: grm)'

- name: reset
  alias: rt
  help: |-
    Reset the current HEAD to a specified state.
    Passes through to `git reset` and accepts any of its flags/args.
  catch_all: true
  examples:
    - 'g rt HEAD~1             # undo last commit, keep changes in the working tree'
    - 'g rt --soft HEAD~1      # undo last commit, keep changes staged'
    - 'g rt --hard origin/<branch>   # discard local changes to match remote (shell alias: grh)'

- name: restore
  alias: re
  help: |-
    Restore working tree files.
    Passes through to `git restore` and accepts any of its flags/args.
  catch_all: true
  examples:
    - 'g re file.txt           # discard unstaged changes to a file'
    - 'g re --staged file.txt  # unstage a file, keeping its changes'
    - 'g re "*"                # discard all unstaged changes (shell alias: grestA)'

- name: cherry-pick
  alias: cp
  help: |-
    Apply the changes introduced by existing commits.
    Passes through to `git cherry-pick` and accepts any of its flags/args.
  catch_all: true
  examples:
    - 'g cp <commit>           # apply a commit onto the current branch (shell alias: gcp)'
    - 'g cp <commitA> <commitB>   # cherry-pick multiple commits'
    - 'g cp --continue         # continue after resolving conflicts'
    - 'g cp --abort            # cancel the cherry-pick'

- name: tag
  alias: t
  help: |-
    Create, list, or delete tags.
    Passes through to `git tag`. With --sync, pushes all tags to origin
    after the tag operation completes.
  catch_all: true
  flags:
    - long: --sync
      short: -s
      help: Push all tags to origin after creating the tag
  examples:
    - 'g t                     # list existing tags (shell alias: gt)'
    - 'g t v1.2.0              # create a lightweight tag'
    - 'g t v1.2.0 --sync       # create a tag and push tags to origin (shell alias: gts)'
    - 'g t -d v1.2.0           # delete a local tag'

- name: clean
  help: |-
    Prune and delete merged local branches.
    Fetches with --prune, then finds local branches whose upstream is gone
    ([gone]) and lets you choose which to delete (select none to delete all).
  examples:
    - 'g clean                 # prune remotes and delete gone branches (shell alias: gclean)'

- name: update
  alias: u
  help: |-
    Update a branch with the latest changes from the remote.
    Checks out the branch (interactive picker if none is given), fetches with
    --prune, and pulls. Returns to your previous branch afterwards unless
    --stay is set.
  args:
    - name: branch
      help: The branch to update (omit to pick interactively)
  flags:
    - long: --stay
      short: -s
      help: Stay on the updated branch instead of returning to the previous one
  examples:
    - 'g update                # pick a branch to update, then return (shell alias: gup)'
    - 'g update main           # update main, then return (shell alias: gupm)'
    - 'g update --stay         # update a chosen branch and stay on it (shell alias: gups)'
    - 'g update main --stay    # update main and stay on it (shell alias: gupms)'

- name: commit-update-stack
  alias: cus
  help: |-
    Commit, then restack every branch built on top of the replaced commit.
    Accepts and passes through any `git commit` flags/args (with no arguments
    it opens the same interactive picker as `g commit`). After committing it
    finds the terminal branches stacked downstream of the old commit and
    rebases each onto the new commit with `git rebase --update-refs`, keeping
    intermediate branch refs in sync across every fork of the stack. Returns
    to your starting branch when done.
  catch_all: true
  examples:
    - 'g cus                    # interactive commit-type picker, then restack (shell alias: gcus)'
    - 'g cus --amend --no-edit  # amend in place and restack downstream branches'
    - 'g cus -m "fix: typo"     # add a commit and move stacked branches on top of it'

- name: push-force-stack
  alias: pfs
  help: |-
    Force push the current branch and every branch stacked downstream of it.
    Walks all branches whose history contains the current commit (following
    every fork of the stack) and force pushes each one that has a matching
    origin branch; branches without a remote counterpart are skipped.
  examples:
    - 'g pfs                    # force push the whole stack from here up (shell alias: gpfs)'

- name: stack-up
  alias: su
  help: |-
    Move up the stack, away from main, to a child of the current commit.
    If the commit has multiple children a picker is shown. Lands on the
    branch pointing at the chosen commit when one exists, otherwise checks
    out the commit directly (detached HEAD).
  examples:
    - 'g su                     # move one commit toward the stack tip (shell alias: gsu)'

- name: stack-down
  alias: sd
  help: |-
    Move down the stack, toward main, to a parent of the current commit.
    If the commit has multiple parents (a merge) a picker is shown. Lands on
    the branch pointing at the chosen commit when one exists, otherwise
    checks out the commit directly (detached HEAD).
  examples:
    - 'g sd                     # move one commit toward main (shell alias: gsd)'

- name: stack-up-select
  alias: sus
  help: |-
    Pick a downstream branch of the current commit and check it out.
    Lists every branch stacked on top of the current commit (across all forks
    of the stack, nearest first) in a picker; auto-selects when there is only
    one candidate.
  examples:
    - 'g sus                    # pick any branch above this one (shell alias: gsus)'

- name: stack-down-select
  alias: sds
  help: |-
    Pick an upstream branch of the current commit and check it out.
    Lists every branch below the current commit (nearest first), searching no
    farther back than the merge base with main; auto-selects when there is
    only one candidate.
  examples:
    - 'g sds                    # pick any branch below this one (shell alias: gsds)'

- name: completions
  help: |-
    Generate shell completion definitions for the git-cli tool.
    Intended to be evaluated from your shell profile, e.g. eval "$(g completions)".
  examples:
    - 'eval "$(g completions)"   # load completions in the current shell'
